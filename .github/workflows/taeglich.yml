name: Heute läuft

on:
  schedule:
    # Einmal täglich um 6 Uhr deutscher Zeit. GitHub kennt nur UTC: 04:00 UTC ist im Sommer
    # 6 Uhr, 05:00 UTC im Winter. Der Schritt „Zeit prüfen“ lässt nur den ersten Lauf ab
    # 6 Uhr arbeiten, der zweite Zeitpunkt wird übersprungen.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:      # erlaubt den Start per Knopfdruck (läuft immer)

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeit prüfen (einmal täglich ab 6 Uhr deutscher Zeit)
        id: zeit
        run: |
          stunde=$(TZ=Europe/Berlin date +%H)
          heute=$(TZ=Europe/Berlin date +%F)
          muster="\"stand\": \"${heute}T(0[6-9]|1[0-9]|2[0-3])"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$stunde" -lt 6 ] || grep -Eq "$muster" heute.json; }; then
            echo "Übersprungen (Stunde $stunde; es ist vor 6 Uhr oder heute.json wurde heute schon ab 6 Uhr erzeugt)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.zeit.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.zeit.outputs.run == 'true'
      - run: python abruf.py
        if: steps.zeit.outputs.run == 'true'
      - name: heute.json speichern
        if: steps.zeit.outputs.run == 'true'
        run: |
          git config user.name "kulturkoepfe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heute.json diagnose || git add heute.json
          git commit -m "Heute läuft: $(date +%F)" || echo "Keine Änderung"
          for versuch in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push fehlgeschlagen (Versuch $versuch), neuer Versuch"
            sleep 5
          done
          exit 1
