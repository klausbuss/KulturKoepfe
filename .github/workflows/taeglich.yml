name: Heute läuft

on:
  schedule:
    - cron: "0 4 * * *"   # täglich 4 Uhr UTC = 5 bzw. 6 Uhr deutscher Zeit
  workflow_dispatch:      # erlaubt den Start per Knopfdruck

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python abruf.py
      - name: heute.json speichern
        run: |
          git config user.name "kulturkoepfe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heute.json
          git commit -m "Heute läuft: $(date +%F)" || echo "Keine Änderung"
          git push
