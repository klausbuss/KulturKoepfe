name: Heute läuft

on:
  schedule:
    # Abends nach 22 Uhr deutscher Zeit, dann holt der Lauf schon die Vorstellungen des Folgetags.
    # So sind die Daten morgens fertig, auch wenn GitHub geplante Läufe um Stunden verzögert.
    # GitHub kennt nur UTC: 21:17 UTC ist im Winter 22:17 Uhr und im Sommer 23:17 Uhr.
    # Der Schritt „Zeit prüfen“ überspringt weitere Läufe, wenn das Zieldatum schon vorliegt.
    - cron: "17 21 * * *"
    - cron: "43 21 * * *"
  workflow_dispatch:      # erlaubt den Start per Knopfdruck (läuft immer)

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeit prüfen (Zieldatum schon vorhanden?)
        id: zeit
        run: |
          ziel=$(TZ=Europe/Berlin date -d '+2 hours' +%F)
          echo "ziel=$ziel" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"datum\": \"${ziel}\"" heute.json; then
            echo "Übersprungen: heute.json enthält schon das Zieldatum ${ziel}"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.zeit.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.zeit.outputs.run == 'true'
      - name: Stand von heute als vortag.json sichern
        if: steps.zeit.outputs.run == 'true'
        run: |
          # Läuft der Abruf abends für den Folgetag, braucht die App den heutigen Stand bis Mitternacht.
          if ! grep -q "\"datum\": \"${{ steps.zeit.outputs.ziel }}\"" heute.json; then cp heute.json vortag.json; fi
      - run: python abruf.py
        if: steps.zeit.outputs.run == 'true'
      - name: heute.json speichern
        if: steps.zeit.outputs.run == 'true'
        run: |
          git config user.name "kulturkoepfe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heute.json vortag.json diagnose || git add heute.json vortag.json
          git commit -m "Heute läuft: ${{ steps.zeit.outputs.ziel }}" || echo "Keine Änderung"
          for versuch in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push fehlgeschlagen (Versuch $versuch), neuer Versuch"
            sleep 5
          done
          exit 1
