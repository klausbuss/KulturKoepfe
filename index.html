<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulturköpfe</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root{--beton:#E4E4E0;--papier:#F7F7F5;--schwarz:#000;--grau:#5E5E5A;--linie:#C9C9C4;
    --u2:#DA421E;--u3:#16683D;--u5:#7E5330;--u6:#8C6DAB;--u7:#528DBA;--u9:#F3791D;--u8:#224F86}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Archivo",Arial,sans-serif;background:var(--beton);color:#000;font-size:16px;line-height:1.45}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--papier);padding-bottom:40px}
  header{padding:22px 18px 6px}
  h1{font-stretch:62%;font-weight:900;font-size:56px;line-height:.85;letter-spacing:-.5px}
  h1 span{display:block}
  .sub{color:var(--grau);font-size:14px;margin-top:8px}
  .stadtwahl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .stadtwahl button{font:inherit;font-weight:800;font-size:16px;color:#000;background:var(--papier);border:1.5px solid #000;border-radius:20px;padding:5px 14px;cursor:pointer}
  .stadtwahl button[aria-pressed="true"]{background:#000;color:#fff}
  .pfad{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:14px 18px 0;font-size:14px;color:var(--grau)}
  .pfad button{font:inherit;color:#000;background:none;border:0;text-decoration:underline;cursor:pointer;padding:2px 0}
  .zurueck{font:inherit;font-weight:700;background:none;border:1.5px solid #000;border-radius:20px;padding:4px 12px;cursor:pointer;margin-right:4px;color:#000;text-decoration:none!important}
  h2{padding:22px 18px 10px;font-stretch:70%;font-weight:900;font-size:32px;line-height:1.05}
  .gross{display:block;width:calc(100% - 36px);margin:0 18px 12px;padding:26px 20px;text-align:left;font:inherit;font-stretch:62%;font-weight:900;font-size:48px;line-height:1;color:#fff;background:#000;border:0;cursor:pointer}
  .gross small{display:block;font-stretch:100%;font-weight:400;font-size:15px;margin-top:8px;opacity:.85}
  .gross.u6{background:var(--u6)} .gross.u9{background:var(--u9)} .gross.u3{background:var(--u3)} .gross.u8{background:var(--u8)}
  .gross.dezent{background:none;color:#000;font-stretch:70%;font-size:26px;padding:4px 0 14px;border-bottom:1px solid var(--linie)}
  .gross.dezent.oben{margin-top:18px}
  .gross.dezent small{color:var(--grau);opacity:1;font-size:14px;margin-top:4px}
  .zeile{display:grid;grid-template-columns:8px 1fr;gap:14px;width:100%;padding:14px 18px;border:0;border-bottom:1px solid var(--linie);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .zeile .bar{border-radius:2px}
  .zeile b{font-stretch:80%;font-size:21px;font-weight:800;display:block;line-height:1.15}
  .zeile small{color:var(--grau);font-size:14px}
  .kopf{padding:18px;border-bottom:1px solid var(--linie);display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:start}
  .portrait{position:relative;width:88px;height:110px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-stretch:62%;font-weight:900;font-size:42px;line-height:1}
  .portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1)}
  .credit{display:block;margin-top:8px;font-size:11px;line-height:1.3;color:var(--grau)}
  .credit a{color:inherit}
  .raster{display:grid;grid-template-columns:1fr 1fr;gap:24px 14px;padding:4px 18px 0}
  .karte .portrait{width:100%;height:auto;aspect-ratio:4/5;font-size:64px}
  .karte b{font-stretch:80%;font-size:19px;font-weight:800;display:block;line-height:1.15;margin-top:8px}
  .karte .rolle{font-size:14px;font-weight:700}
  .hauslink{font:inherit;font-size:14px;color:var(--grau);background:none;border:0;padding:0;margin-top:2px;text-align:left;text-decoration:underline;cursor:pointer}
  h3{padding:28px 18px 6px;font-stretch:70%;font-weight:900;font-size:24px}
  .person{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 18px;border-bottom:1px solid var(--linie);align-items:start}
  .person .portrait{width:56px;height:70px;font-size:26px}
  .person b{font-stretch:80%;font-size:19px;font-weight:800;display:block;line-height:1.15}
  .person p{font-size:14px;margin-top:2px}
  .preis{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 18px;border-bottom:1px solid var(--linie);align-items:baseline}
  .preis .jahr{font-stretch:62%;font-weight:900;font-size:26px;line-height:1}
  .preis b{font-stretch:80%;font-size:19px;font-weight:800;display:block;line-height:1.15}
  .preis p{font-size:14px;margin-top:2px}
  .preis small{display:block;font-size:13px;color:var(--grau);margin-top:2px}
  .info.hausehre{color:#000;font-weight:700;padding-bottom:8px}
  .heute{margin:0 18px 12px;padding:12px 14px;background:#000;color:#fff}
  .heute h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
  .heute ul{list-style:none}
  .heute li{margin-top:6px}
  .heute li b{font-stretch:80%;font-size:20px;font-weight:800;line-height:1.15}
  .heute li span{display:block;font-size:14px;opacity:.85}
  .heute a{color:inherit}
  .heute.leer{background:none;color:var(--grau);border:1px solid var(--linie)}
  .heute-kurz{display:block;font-size:13px;font-weight:700;color:#000;margin-top:2px}
  .info.klein{font-size:13px;padding-top:12px}
  .kopf b{font-stretch:70%;font-weight:900;font-size:34px;line-height:1;display:block}
  .kopf .rolle{font-weight:700;margin-top:4px}
  .kopf p{margin-top:8px;max-width:60ch}
  .info{padding:4px 18px 0;color:var(--grau);max-width:60ch}
  .link{display:inline-block;margin:0 18px 8px;padding:12px 18px;background:#000;color:#fff;text-decoration:none;font-weight:700}
  .stand{padding:24px 18px 0;font-size:13px;color:var(--grau)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--u9);outline-offset:2px}
</style>
</head>

</div>

// Fotos werden für alle Personen gesucht: erst in der deutschen, dann in der englischen
// Wikipedia, zuletzt über Wikidata (Bild-Eigenschaft P18). Alle Quellen verweisen auf
// frei lizenzierte Bilder in Wikimedia Commons.
// Schutz gegen Namensvettern: Artikel oder Wikidata-Beschreibung muss einen Bühnenbezug haben
const BUEHNE = /Intendant|Theat|Oper|Ballet|Choreogra|Regisseur|Director|Dramaturg|Kulturmanager|Bühne|Stage|Schauspiel|Actor|Actress|Performance|Perform|Dirigent|Conductor|Orchest|Festspiele|Festival|Musiker|Musician|Komponist|Composer|Tänzer|Dancer|Sänger|Singer|Filmemacher|Filmmaker/i;
const initialen = n => n.split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join("");
const bilder = {};
const holeJSON = url => fetch(url).then(r=>r.ok ? r.json() : null).catch(()=>null);

async function ausWikipedia(name, sprache){
  const d = await holeJSON(`https://${sprache}.wikipedia.org/api/rest_v1/page/summary/` + encodeURIComponent(name.replace(/ /g,"_")));
  if(!d || d.type!=="standard" || !d.thumbnail || !BUEHNE.test((d.description||"") + " " + (d.extract||""))) return null;
  return {src:d.thumbnail.source, datei:decodeURIComponent((d.originalimage||d.thumbnail).source.split("/").pop())};
}

async function ausWikidata(name){
  const api = "https://www.wikidata.org/w/api.php?format=json&origin=*&";
  const s = await holeJSON(api + "action=wbsearchentities&type=item&language=de&uselang=de&limit=7&search=" + encodeURIComponent(name));
  const passend = (s?.search||[]).filter(e=>(e.label||"").toLowerCase()===name.toLowerCase() && BUEHNE.test(e.description||""));
  if(!passend.length) return null;
  const d = await holeJSON(api + "action=wbgetentities&props=claims&ids=" + passend.map(e=>e.id).join("|"));
  for(const e of passend){
    const datei = d?.entities?.[e.id]?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
    if(datei) return {src:"https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(datei) + "?width=330", datei};
  }
  return null;
}

async function ladeBild(name){
  if(name in bilder) return bilder[name];
  return bilder[name] = (async()=>{
    const eigen = intendanz.find(p=>p.name===name && p.foto);   // Foto liegt im Repo
    if(eigen?.foto==="-") return null;   // bewusst kein Foto (Suche lieferte das falsche)
    if(eigen) return {src:eigen.foto, seite:"", autor:eigen.credit, lizenz:"", eigen:true};
    const fund = await ausWikipedia(name,"de") || await ausWikipedia(name,"en") || await ausWikidata(name);
    if(!fund) return null;
    const bild = {src:fund.src, seite:"https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(fund.datei), autor:"", lizenz:""};
    const m = await holeJSON("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&titles=File:" + encodeURIComponent(fund.datei));
    const meta = Object.values(m?.query?.pages||{})[0]?.imageinfo?.[0]?.extmetadata || {};
    const tmp = document.createElement("div"); tmp.innerHTML = meta.Artist?.value || "";
    bild.autor = tmp.textContent.trim();
    bild.lizenz = meta.LicenseShortName?.value || "";
    return bild;
  })();
}

function zeigeBilder(hausId){
  document.querySelectorAll("[data-name]").forEach(async el=>{
    const bild = await ladeBild(el.dataset.name);
    if(!bild || state.haus!==hausId) return;
    const img = new Image();
    img.alt = "Foto von " + el.dataset.name;
    img.onload = ()=>{
      el.querySelector(".portrait").append(img);
      if(bild.eigen && !bild.autor) return;   // eigenes Foto ohne Nachweis: keine Zeile
      const c = document.createElement("small"); c.className = "credit";
      const txt = "Foto: " + [bild.autor, bild.lizenz].filter(Boolean).join(", ") + (bild.autor||bild.lizenz ? "" : "Wikimedia Commons");
      if(bild.eigen) c.textContent = txt;
      else {
        const a = document.createElement("a"); a.href = bild.seite; a.target = "_blank"; a.rel = "noopener";
        a.textContent = txt; c.append(a);
      } el.querySelector(".text").append(c);
    };
    img.src = bild.src;
  });
}

const state = {stadt:"berlin", bereich:null, haus:null};

const schritte = () => [
  state.bereich && {label:BEREICHE[state.bereich], reset:{bereich:null,haus:null}},

function personHTML([name,info],farbe){
  return `<div class="person" data-name="${name}">
    <div class="portrait" style="background:${farbe}" aria-hidden="true">${initialen(name)}</div>
    <div class="text"><b>${name}</b><p>${info}</p></div></div>`;
}
function kuenstlerHTML(h){
  const k = KUENSTLER[h.id]; if(!k) return preisHTML(h);
  const f = SPARTEN[h.sparte];
  return `<h3>Regie</h3>` + k.regie.map(x=>personHTML(x,f)).join("") +
    `<h3>Ensemble</h3>` + (k.ensemble.length ? k.ensemble.map(x=>personHTML(x,f)).join("") : `<p class="info">${k.hinweis}</p>`) +
    `<p class="info klein">Auswahl prägender Namen, Stand Oktober 2026.</p>` + preisHTML(h);
}
function preisHTML(h){
  const p = PREISE[h.id]; if(!p) return "";
  const f = SPARTEN[h.sparte];
  return `<h3>Ausgezeichnet seit 2016</h3>` +
    (p.haus ? `<p class="info hausehre">${p.haus}</p>` : "") +
    (p.liste.length ? p.liste.map(([jahr,titel,regie,preis])=>`
      <div class="preis"><span class="jahr" style="color:${f}">${jahr}</span>
        <div><b>${titel}</b><p>Regie: ${regie}</p><small>${preis}</small></div></div>`).join("")
      : `<p class="info">${p.hinweis}</p>`) +
    `<p class="info klein">Theatertreffen: Auswahl der zehn bemerkenswertesten Inszenierungen des Jahres. Dazu Auszeichnungen wie die Kritikerumfrage von Theater heute oder der Nestroy-Preis.</p>`;
}

// „Heute läuft“: wird täglich von abruf.py erzeugt
let HEUTE = null;
const esc = t => String(t||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heuteISO = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Berlin"}).format(new Date());
const heute = id => HEUTE && HEUTE[id];
const datumKurz = iso => new Date(iso+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
function heuteKurz(id){
  const h = heute(id); if(!h) return "";
  if(h.ausstellungen){
    if(h.status!=="ok") return "";
    const a = h.ausstellungen[0], mehr = h.ausstellungen.length-1;
    return `<span class="heute-kurz">Aktuell: ${esc(a.titel)}${mehr>0 ? " (+"+mehr+")" : ""}</span>`;
  }
  if(h.status==="keine") return `<span class="heute-kurz">Heute keine Vorstellung</span>`;
  if(h.status!=="ok") return "";
  const v = h.vorstellungen[0], mehr = h.vorstellungen.length-1;
  return `<span class="heute-kurz">Heute: ${esc(v.titel)}${v.zeit ? ", "+v.zeit : ""}${mehr>0 ? " (+"+mehr+")" : ""}</span>`;
}
function heuteBlock(id){
  const h = heute(id); if(!h) return "";
  if(h.ausstellungen){
    if(h.status!=="ok") return "";
    return `<div class="heute"><h4>Aktuelle Ausstellungen</h4><ul>` + h.ausstellungen.map(a=>`
      <li><b>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titel)}</a>` : esc(a.titel)}</b>
      <span>bis ${datumKurz(a.bis)}</span></li>`).join("") + `</ul></div>`;
  }
  if(h.status==="keine") return `<div class="heute leer"><h4>Heute läuft</h4><ul><li><span>Heute keine Vorstellung</span></li></ul></div>`;
  if(h.status!=="ok") return "";
  return `<div class="heute"><h4>Heute läuft</h4><ul>` + h.vorstellungen.map(v=>`
    <li><b>${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.titel)}</a>` : esc(v.titel)}</b>
    <span>${[v.zeit ? v.zeit+" Uhr" : "", esc(v.ort)].filter(Boolean).join(" · ")}</span></li>`).join("") + `</ul></div>`;
}
fetch("heute.json",{cache:"no-store"}).then(r=>r.ok ? r.json() : null).then(d=>{
  if(d && d.datum===heuteISO()){ HEUTE = d.haeuser; render(); }
}).catch(()=>{});

const STAEDTE = {berlin:"Berlins", hamburg:"Hamburgs", muenchen:"Münchens", wien:"Wiens"};
const imOrt = h => h.stadt===state.stadt;
const anzahl = b => HAEUSER.filter(h=>imOrt(h) && h.bereich===b).length;
const leute = () => intendanz.filter(p=>{const h=haus(p.haus); return imOrt(h) && h.bereich===state.bereich;})
  .filter((p,i,alle)=>alle.findIndex(q=>q.name===p.name)===i);  // wer mehrere Häuser leitet, nur einmal

function render(){
  document.querySelectorAll("[data-stadt]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.stadt===state.stadt));
  $("sub").textContent = `Die öffentlichen Bühnen und Museen ${STAEDTE[state.stadt]} und wer sie leitet`;
  const s = schritte();
  $("pfad").innerHTML = s.length ? `<button class="zurueck" data-zurueck>Zurück</button>` +
    s.map((x,i)=>`<button data-schritt="${i}">${x.label}</button>`).join("<span>/</span>") : "";
  let v = "";
  if(!state.bereich){
    v = `<h2>Was interessiert dich?</h2>
      <button class="gross" data-set='{"bereich":"theater"}'>Theater<small>${anzahl("theater")} öffentliche Bühnen</small></button>
      <button class="gross u3" data-set='{"bereich":"musik"}'>Musik<small>${anzahl("musik")} Opern, Konzerthäuser und Orchester</small></button>
      <button class="gross u8" data-set='{"bereich":"museen"}'>Museen<small>${anzahl("museen")} Museen und Ausstellungshäuser</small></button>`;
  } else if(!state.haus){
    v = `
      <button class="gross dezent oben" data-set='{"haus":"alle"}'><span aria-hidden="true">→ </span>Übersicht<small>${leute().length} Leitungspersonen</small></button>
      <h2>${{theater:"Die Theater:", musik:"Die Häuser:", museen:"Die Museen:"}[state.bereich]}</h2>` + HAEUSER.filter(h=>imOrt(h) && h.bereich===state.bereich).map(h=>`
      <button class="zeile" data-set='{"haus":"${h.id}"}'>
        <span class="bar" style="background:${SPARTEN[h.sparte]}"></span>
        <span><b>${h.name}</b><small>${h.zusatz ? h.zusatz + ", " : ""}${h.bezirk}</small>${heuteKurz(h.id)}</span>
      </button>`).join("");
  } else if(state.haus==="alle"){
    v = `<h2>Übersicht ${BEREICHE[state.bereich]}</h2><div class="raster">` + leute().map(p=>{
      const h = haus(p.haus);
      return `<div class="karte" data-name="${p.name}">
        <div class="portrait" style="background:${SPARTEN[h.sparte]}" aria-hidden="true">${initialen(p.name)}</div>
        <div class="text"><b>${p.name}</b><div class="rolle">${p.rolle}</div>
          <button class="hauslink" data-set='{"haus":"${h.id}"}'>${h.name}</button></div>
      </div>`;}).join("") + `</div>`;
  } else {
    const h = haus(state.haus);
    const team = intendanz.filter(p=>p.haus===h.id);
    v = `<h2>${h.name}</h2>` + heuteBlock(h.id) + `
      <a class="link" href="https://${h.web}" target="_blank" rel="noopener">${h.bereich==="museen" ? "Ausstellungen" : "Spielplan"} auf ${h.web.split("/")[0]}</a>
      <h3>Leitung</h3>` + team.map(p=>`
        <div class="kopf" data-name="${p.name}">
          <div class="portrait" style="background:${SPARTEN[h.sparte]}" aria-hidden="true">${initialen(p.name)}</div>
          <div class="text"><b>${p.name}</b><div class="rolle">${p.rolle}</div><p>${p.bio}</p></div>
        </div>`).join("") + (team.length ? "" : `<p class="info">${h.hinweis||""}</p>`) + kuenstlerHTML(h);
  }
  $("view").innerHTML = v;
  if(state.haus) zeigeBilder(state.haus);
}

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return;
  if(t.dataset.stadt) Object.assign(state, {stadt:t.dataset.stadt, bereich:null, haus:null});
  else if(t.dataset.set) Object.assign(state, JSON.parse(t.dataset.set));
  else if(t.hasAttribute("data-zurueck")){ const s = schritte(); Object.assign(state, s[s.length-1].reset); }
  else if(t.dataset.schritt){ const s = schritte(), i = +t.dataset.schritt; if(s[i+1]) Object.assign(state, s[i+1].reset); }
  else return;
  render(); window.scrollTo(0,0);
  const f = document.querySelector("main button, main a"); if(f) f.focus({preventScroll:true});
});
render();
